name: Build PDFs

on:
  push:
  workflow_dispatch:

# Don't let two pushes publish the release at the same time.
concurrency:
  group: pdf-${{ github.ref }}

jobs:
  pdf:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # to publish the release
    steps:
      - uses: actions/checkout@v5

      # Same font as the local builds (Roboto), so line widths, and thus the wrap check, match.
      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-roboto

      - name: Generate PDFs and check line wraps
        run: |
          mkdir -p pdf
          status=0
          for md in *.md; do
            [ "$md" = README.md ] && continue
            echo "::group::$md"
            node efb-pdf.mjs "$md" -o "pdf/${md%.md}.pdf" --check-wraps || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Upload PDFs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pdfs
          path: pdf/*.pdf
          if-no-files-found: error

      # On master, replace the "pdf" release with the new PDFs. Stable download links:
      #   https://github.com/<owner>/<repo>/releases/download/pdf/<name>.pdf
      # Skipped when the wrap check fails, so the release always holds a clean build.
      - name: Publish release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete pdf --cleanup-tag --yes 2>/dev/null || true
          gh release create pdf pdf/*.pdf \
            --target "$GITHUB_SHA" \
            --title "Latest PDFs" \
            --notes "Built automatically from ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC')." \
            --latest
